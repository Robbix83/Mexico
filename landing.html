<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvo — מערכת ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&family=Heebo:wght@300;400;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { font-family:'Rubik','Heebo',sans-serif; background:#0c0a09; overflow:hidden; }

/* ══ LAYOUT ══ */
.page { display:flex; height:100vh; width:100%; }

/* ══ DARK PANEL (right) ══ */
.p-dark {
  flex:1; position:relative;
  display:flex; align-items:center; justify-content:center;
  padding:48px 52px;
  background:#0c0a09;
  animation:slideL .6s cubic-bezier(.22,1,.36,1) .05s both;
}
.p-dark::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 400px 400px at 40% 50%, rgba(204,26,26,.06) 0%, transparent 70%);
  pointer-events:none;
}
.vline {
  position:absolute; left:0; top:8%; bottom:8%; width:1px;
  background:linear-gradient(to bottom, transparent, rgba(204,26,26,.3) 30%, rgba(204,26,26,.3) 70%, transparent);
}
.login-box {
  position:relative; z-index:2;
  width:100%; max-width:340px; text-align:center;
  animation:fadeUp .5s ease .35s both;
}

/* Clock + Greeting */
.lx-clock { font-size:2.6rem; font-weight:800; color:rgba(255,255,255,.85); letter-spacing:4px; direction:ltr; font-variant-numeric:tabular-nums; line-height:1; margin-bottom:4px; }
.lx-greet { font-size:.7rem; color:rgba(255,255,255,.22); letter-spacing:2px; margin-bottom:32px; }

/* Active badge */
.lx-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(204,26,26,.08); border:1px solid rgba(204,26,26,.2); border-radius:100px; padding:5px 16px; font-size:.7rem; font-weight:600; color:rgba(204,26,26,.7); margin-bottom:26px; }
.lx-dot { width:6px; height:6px; border-radius:50%; background:#CC1A1A; box-shadow:0 0 6px rgba(204,26,26,.8); animation:dp 2s ease-in-out infinite; }
@keyframes dp { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.65)} }

/* Title */
.lx-title { font-size:1.9rem; font-weight:800; color:#fff; letter-spacing:-.5px; margin-bottom:4px; }
.lx-by { font-size:.67rem; color:rgba(255,255,255,.18); letter-spacing:3px; text-transform:uppercase; margin-bottom:26px; }
.lx-hr { width:100%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent); margin-bottom:22px; }

/* Buttons — accessibility: 1rem */
.lx-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px; border-radius:12px;
  font-family:'Rubik',sans-serif; font-size:1rem; font-weight:700;
  cursor:pointer; border:none; margin-bottom:10px;
  text-decoration:none; transition:all .18s;
}
.lx-btn-p { background:#CC1A1A; color:#fff; box-shadow:0 8px 24px rgba(204,26,26,.28); }
.lx-btn-p:hover { background:#e02020; transform:translateY(-1px); }
.lx-btn-g { background:rgba(255,255,255,.05); color:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.08); }
.lx-btn-g:hover { background:rgba(255,255,255,.09); color:rgba(255,255,255,.7); }

/* Bottom strip */
.lx-strip { display:flex; align-items:center; justify-content:center; gap:12px; padding-top:18px; border-top:1px solid rgba(255,255,255,.05); font-size:.66rem; color:rgba(255,255,255,.16); }
.lx-strip-s { width:1px; height:10px; background:rgba(255,255,255,.07); }

/* ══ RED PANEL (left) ══ */
.p-red {
  width:38%; background:#CC1A1A; position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:48px 52px;
}
.p-red::before { content:''; position:absolute; top:-60%; right:-35%; width:90%; height:180%; background:rgba(255,255,255,.065); transform:rotate(-18deg); pointer-events:none; }
.p-red::after  { content:''; position:absolute; bottom:0; left:0; width:100%; height:32%; background:linear-gradient(to top,rgba(0,0,0,.2),transparent); pointer-events:none; }
.wm { position:absolute; bottom:-40px; left:-20px; right:-20px; font-size:clamp(100px,12vw,160px); font-weight:900; color:rgba(0,0,0,.1); letter-spacing:-6px; pointer-events:none; user-select:none; line-height:1; white-space:nowrap; }
.dots { position:absolute; top:40px; left:40px; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; opacity:.2; }
.dots span { display:block; width:4px; height:4px; border-radius:50%; background:#fff; }
.rc { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:space-between; }
.logo-b { display:inline-flex; align-self:flex-start; }
.logo-b img { height:120px; display:block; filter:brightness(0) invert(1); }
.mid { flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 0; }

/* Typewriter */
.tw-cur { display:inline-block; color:rgba(255,255,255,.8); font-weight:400; animation:twb .65s step-end infinite; margin-right:2px; }
.tw-cur::after { content:'_'; }
@keyframes twb { 0%,100%{opacity:1} 50%{opacity:0} }

.h1 { font-size:clamp(2.2rem,3vw,3.2rem); font-weight:800; line-height:1.05; color:#fff; letter-spacing:-1.5px; margin-bottom:18px; min-height:3.3em; }
.sub { font-size:.88rem; font-weight:300; color:rgba(255,255,255,.6); line-height:1.7; }
.tag { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; margin-top:22px; padding:4px 11px 4px 9px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12); border-radius:5px; font-size:.63rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.85); }
.tag::before { content:''; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.45); flex-shrink:0; }

.stats { display:flex; gap:28px; margin-bottom:20px; }
.sn { font-size:1.5rem; font-weight:800; color:#fff; line-height:1; margin-bottom:3px; }
.sl { font-size:.67rem; color:rgba(255,255,255,.45); }
.pdots { display:flex; gap:6px; }
.pdots span { display:block; height:4px; border-radius:2px; }
.pdots .on  { width:24px; background:#fff; }
.pdots .off { width:8px; background:rgba(255,255,255,.3); }

/* ══ ANIMATIONS ══ */
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideR { from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideL { from{opacity:0;transform:translateX(-24px)} to{opacity:1;transform:translateX(0)} }

/* ══ MODAL ══ */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(4,3,2,.85); backdrop-filter:blur(8px);
  z-index:1000; display:none;
  align-items:center; justify-content:center;
  padding:20px; animation:fadeIn .2s ease;
}
.modal-overlay.open { display:flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-card {
  background:#fff; border-radius:18px;
  padding:36px 32px 28px;
  width:100%; max-width:440px;
  position:relative;
  animation:modalUp .25s cubic-bezier(.22,1,.36,1);
}
@keyframes modalUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.modal-close {
  position:absolute; top:14px; left:14px;
  width:32px; height:32px; border-radius:50%; border:none;
  background:#f4f4f4; color:#666; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.modal-close:hover { background:#e8e8e8; color:#333; }
.modal-title { font-size:1.25rem; font-weight:800; color:#111; margin-bottom:4px; text-align:right; }
.modal-sub { font-size:.82rem; color:#888; margin-bottom:22px; text-align:right; }

/* Form — accessibility: labels 1rem */
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:1rem; font-weight:600; color:#333; margin-bottom:5px; text-align:right; }
.form-group input,
.form-group textarea,
.form-group select {
  width:100%; padding:11px 13px; border:1.5px solid #ddd; border-radius:9px;
  font-family:'Rubik',sans-serif; font-size:.95rem; color:#111;
  background:#fafafa; outline:none; transition:border-color .15s;
  text-align:right;
}
.form-group input:focus,
.form-group textarea:focus { border-color:#CC1A1A; background:#fff; }
.form-group textarea { min-height:80px; resize:vertical; }
.modal-actions { display:flex; gap:10px; margin-top:20px; flex-direction:row-reverse; }
.btn-modal-primary {
  flex:1; padding:13px; border-radius:10px; border:none;
  background:#CC1A1A; color:#fff; font-family:'Rubik',sans-serif;
  font-size:1rem; font-weight:700; cursor:pointer; transition:background .15s;
}
.btn-modal-primary:hover { background:#e02020; }
.btn-modal-outline {
  padding:13px 20px; border-radius:10px;
  border:1.5px solid #ddd; background:#fff; color:#555;
  font-family:'Rubik',sans-serif; font-size:1rem; font-weight:600;
  cursor:pointer; transition:all .15s;
}
.btn-modal-outline:hover { border-color:#bbb; color:#333; }
.modal-error   { display:none; margin-bottom:10px; padding:10px 13px; background:#fff2f2; border:1px solid #fcc; border-radius:8px; font-size:.85rem; color:#c00; text-align:right; }
.modal-success { display:none; margin-bottom:10px; padding:10px 13px; background:#f0fff4; border:1px solid #b2dfdb; border-radius:8px; font-size:.85rem; color:#2e7d32; text-align:right; }
.modal-error.show, .modal-success.show { display:block; }

/* ══ RESPONSIVE ══ */
@media (max-width:768px) {
  .page { flex-direction:column-reverse; }
  .p-red { width:100%; min-height:45vh; padding:32px 28px; }
  .p-dark { padding:32px 28px; }
  .h1 { font-size:2rem; min-height:unset; }
  .stats { display:none; }
}
</style>
</head>
<body>

<div class="page">

  <!-- ══ DARK PANEL ══ -->
  <div class="p-dark">
    <div class="vline"></div>
    <div class="login-box">
      <div class="lx-clock" id="clockEl">00:00</div>
      <div class="lx-greet" id="greetEl">טוען...</div>
      <div class="lx-badge"><span class="lx-dot"></span>מערכת פעילה</div>
      <div class="lx-title">ברוכים הבאים</div>
      <div class="lx-by">By RobXSystems</div>
      <div class="lx-hr"></div>
      <a class="lx-btn lx-btn-p" href="/login">🔐 כניסה למערכת</a>
      <button class="lx-btn lx-btn-g" onclick="openRequestModal()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3M13 5a2 2 0 1 0-4 0 2 2 0 0 0 4 0zM7 20a7 7 0 0 1 12 0"/></svg>
        בקשת גישה
      </button>
      <div class="lx-strip">
        <span>🔒 SSL</span><div class="lx-strip-s"></div>
        <span>📡 24/7</span><div class="lx-strip-s"></div>
        <span>🛡 מאובטח</span>
      </div>
    </div>
  </div>

  <!-- ══ RED PANEL ══ -->
  <div class="p-red">
    <div class="wm" style="display:none"></div>
    <div class="dots">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="rc">
      <div class="logo-b">
        <img src="/logo.png" alt=""
             onerror="this.style.display='none'">
      </div>
      <div class="mid">
        <div class="h1"><span id="twText"></span><span class="tw-cur"></span></div>
        <p class="sub">מערכת אחת. כל הנתונים.</p>
        <div class="tag">by RobXSystems</div>
      </div>
      <div>
        <div class="stats">
          <div><div class="sn">24/7</div><div class="sl">זמינות</div></div>
          <div><div class="sn">SSL</div><div class="sl">מוצפן</div></div>
          <div><div class="sn">99.9%</div><div class="sl">uptime</div></div>
        </div>
        <div class="pdots"><span class="on"></span><span class="off"></span><span class="off"></span></div>
      </div>
    </div>
  </div>

</div><!-- /page -->


<!-- ══ MODAL: בקשת גישה ══ -->
<div class="modal-overlay" id="requestModal" role="dialog" aria-modal="true" aria-labelledby="requestTitle">
  <div class="modal-card">
    <button class="modal-close" onclick="closeRequestModal()" aria-label="סגור">✕</button>
    <div class="modal-title" id="requestTitle">בקשת גישה למערכת</div>
    <div class="modal-sub">מלא את הטופס ונחזור אליך בהקדם</div>
    <div class="modal-error"  id="requestError"></div>
    <div class="modal-success" id="requestSuccess"></div>
    <form id="requestForm" onsubmit="submitRequest(event)" novalidate>
      <div class="form-group">
        <label for="reqName">שם מלא</label>
        <input type="text" id="reqName" placeholder="שם פרטי ושם משפחה" required>
      </div>
      <div class="form-group">
        <label for="reqEmail">כתובת אימייל</label>
        <input type="email" id="reqEmail" placeholder="name@company.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label for="reqPhone">טלפון</label>
        <input type="tel" id="reqPhone" placeholder="05X-XXXXXXX" dir="ltr">
      </div>
      <div class="form-group">
        <label for="reqDivision">מחלקה</label>
        <input list="divisionList" id="reqDivision" placeholder="בחר או הקלד מחלקה" required>
        <datalist id="divisionList">
          <option value="בקרה ואוטומציה">
          <option value="CCTV ומצלמות">
          <option value="כיבוי אש">
          <option value="כניסה ובקרה">
          <option value="רשתות תקשורת">
          <option value="הנהלה">
          <option value="כספים">
          <option value="מנהלה">
        </datalist>
      </div>
      <div class="form-group">
        <label for="reqReason">סיבת הבקשה (אופציונלי)</label>
        <textarea id="reqReason" placeholder="תאר בקצרה מדוע את/ה זקוק/ה לגישה..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-modal-primary" id="requestSubmitBtn">שלח בקשה</button>
        <button type="button" class="btn-modal-outline" onclick="closeRequestModal()">ביטול</button>
      </div>
    </form>
  </div>
</div>


<script>
/* ── Israel Time ── */
function ilTime() {
  var parts = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Jerusalem', hour:'2-digit', minute:'2-digit', hour12:false
  }).formatToParts(new Date());
  var h='',m='';
  for (var i=0;i<parts.length;i++) {
    if (parts[i].type==='hour')   h=parts[i].value;
    if (parts[i].type==='minute') m=parts[i].value;
  }
  return { h:parseInt(h,10), hStr:h, mStr:m };
}

/* ── Clock + Greeting ── */
(function() {
  var ce = document.getElementById('clockEl');
  var ge = document.getElementById('greetEl');
  function tick() {
    var t = ilTime();
    ce.textContent = t.hStr + ':' + t.mStr;
    var hr = t.h;
    ge.textContent = hr>=5&&hr<12 ? '☀️ בוקר טוב'
                   : hr>=12&&hr<17? '🌤 צהריים טובים'
                   : hr>=17&&hr<21? '🌆 ערב טוב'
                   : '🌙 לילה טוב';
  }
  tick(); setInterval(tick, 10000);
})();

/* ── Typewriter ── */
(function() {
  var phrases = ['בקרה ואוטומציה','ניהול משימות','תיעוד מתקדם','ניהול פרויקטים','ניהול מחסנים'];
  var el = document.getElementById('twText');
  var pi=0, ci=0, del=false, paused=false;
  var C=75, D=35, P=2400;
  window._tw = { get pi(){return pi;}, get ci(){return ci;}, get del(){return del;}, get paused(){return paused;} };
  function tick() {
    if (paused) return;
    var ph = phrases[pi];
    if (!del) {
      ci++; el.textContent = ph.substring(0,ci);
      if (ci===ph.length) { paused=true; setTimeout(function(){paused=false;del=true;setTimeout(tick,D);},P); return; }
      setTimeout(tick,C);
    } else {
      ci--; el.textContent = ph.substring(0,ci);
      if (ci===0) { del=false; pi=(pi+1)%phrases.length; setTimeout(tick,C+80); return; }
      setTimeout(tick,D);
    }
  }
  setTimeout(tick, 800);
  window.addEventListener('pagehide', function() {
    try { sessionStorage.setItem('twState', JSON.stringify({pi:pi, ci:ci, del:del})); } catch(e){}
  });
})();

/* ── Modal helpers ── */
function _showError(id,msg)   { var e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }
function _hideError(id)       { var e=document.getElementById(id); e.textContent='';  e.classList.remove('show'); }
function _showSuccess(id,msg) { var e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }

function openRequestModal() {
  document.getElementById('requestModal').classList.add('open');
  document.getElementById('requestForm').reset();
  _hideError('requestError');
  document.getElementById('requestSuccess').classList.remove('show');
  setTimeout(function(){ document.getElementById('reqName').focus(); }, 100);
}
function closeRequestModal() {
  document.getElementById('requestModal').classList.remove('open');
}

async function submitRequest(e) {
  e.preventDefault();
  _hideError('requestError');
  var name     = document.getElementById('reqName').value.trim();
  var email    = document.getElementById('reqEmail').value.trim();
  var phone    = document.getElementById('reqPhone').value.trim();
  var division = document.getElementById('reqDivision').value.trim();
  var reason   = document.getElementById('reqReason').value.trim();
  if (!name||!email||!division) { _showError('requestError','נא למלא שם מלא, אימייל ומחלקה.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { _showError('requestError','כתובת האימייל אינה תקינה.'); return; }
  var btn = document.getElementById('requestSubmitBtn');
  btn.disabled=true; btn.textContent='שולח...';
  try {
    var res  = await fetch('/api/user-requests', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,email,phone,division,reason}) });
    var data = await res.json();
    if (res.ok) {
      _showSuccess('requestSuccess','הבקשה נשלחה בהצלחה! נחזור אליך בקרוב.');
      document.getElementById('requestForm').reset();
      setTimeout(closeRequestModal, 2800);
    } else { _showError('requestError', data.message||'שגיאה בשליחת הבקשה.'); }
  } catch(err) { _showError('requestError','שגיאת תקשורת. נסה שוב.'); }
  finally { btn.disabled=false; btn.textContent='שלח בקשה'; }
}

/* ── Close on overlay click / Escape ── */
document.getElementById('requestModal').addEventListener('click', function(e){ if(e.target===this) closeRequestModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeRequestModal(); });
</script>
</body>
</html>
